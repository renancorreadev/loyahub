services:
  loyahub_db:
    image: postgres:15-alpine
    container_name: loyahub_db
    restart: always
    env_file:
      - ./.env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: postgres -c 'max_connections=100' -c 'shared_buffers=128MB'
    networks:
      protocol:
        ipv4_address: 172.16.239.14

volumes:
  postgres_data:
    driver: local

networks:
  protocol:
    external: true  

